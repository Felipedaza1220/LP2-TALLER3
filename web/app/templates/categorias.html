{% extends "base.html" %}

{% block title %}Categorías - Tienda Virtual{% endblock %}

{% block content %}

<h2>Categorías</h2>

{% if categorias %}

    <ul>
        {% for categoria in categorias %}
            <li>
                <a href="{{ url_for('main.inicio', categoria_id=categoria.id) }}">
                    {{ categoria.nombre }}
                </a>
            </li>
        {% endfor %}
    </ul>

{% else %}

    <p>No hay categorías disponibles.</p>

{% endif %}

{% endblock %}
